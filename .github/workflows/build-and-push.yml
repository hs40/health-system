# ============================================================
# 健康运动管理系统 · CI 构建并推送 ghcr.io
#
# 触发：
#   - push main  → 推 :latest + :sha-<短哈希>
#   - git tag v* → 推 :v<版本号> + :latest
#
# 镜像 secret-free：secrets/ 不在仓库中（gitignore + dockerignore），
# 运行时通过 compose 卷挂载注入。
# ============================================================
name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # git tag v1.0.8 → "v1.0.8"
            type=semver,pattern={{raw}}
            # 每次构建 → "sha-<短哈希>"
            type=sha,prefix=sha-,format=short
            # 每次构建 → "latest"（仅 main 和 tag 触发，PR 不触发）
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.single
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
