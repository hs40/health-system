# ============================================================
# 健康运动管理系统 · CI 构建并推送 ghcr.io
#
# 触发：
#   - push main  → 推 :latest + :sha-<短哈希>
#   - git tag v* → 推 :v<版本号> + :latest
#
# 镜像 secret-free：secrets/ 不在仓库中（gitignore + dockerignore），
# 运行时通过 compose 卷挂载注入。
# ============================================================
name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 质量门禁：镜像构建的前置条件（ARCHITECTURE_REVIEW A.9.1）。
  # ruff + pytest + 前端类型检查 + 前端构建 任一失败 → build-and-push 不启动。
  #
  # 前端类型检查必须**先 gen:api 再 tsc**（A.9）：
  # `schema.d.ts` 不入库，类型是从后端 OpenAPI 现生成的。顺序错了会直接
  # 「找不到模块」——这是刻意的，让「忘了生成」在构建期暴露。
  #
  # 前端**构建**也在这里做（v3.4.7）。Dockerfile 只 COPY 产物，不碰 npm：
  # lock 在 Windows 生成，缺 Linux/Alpine 的原生模块，镜像 stage 里装不全。
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        # 必装全量依赖（含 fitdecode / garmin-fit-sdk），否则 FIT 相关用例会被跳过
        run: pip install -e "./backend[dev]"

      - name: Ruff
        run: ruff check app/ scripts/ tests/
        working-directory: backend

      - name: Pytest
        run: python -m pytest tests/ -q
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        # `npm ci` 严格照 lock 安装，能保证可复现；但 `package-lock.json` 是在
        # Windows 上生成的，npm 只记录**当前平台**的可选依赖，lock 里没有
        # `@rollup/rollup-linux-x64-gnu` / `@esbuild/linux-x64`。
        # 结果是 `vite build` 报 "Cannot find module @rollup/rollup-linux-x64-gnu"。
        #
        # 所以分两步：先用 npm ci 还原 lock 里的一切，
        # 再显式补上 Linux 平台的原生包（--no-save，不污染 lock）。
        #
        # **必须带精确版本**：平台包与主包的版本是硬绑定（esbuild 0.21.5 ↔
        # @esbuild/linux-x64 0.21.5）。不写版本号会装 latest，vite 加载时报
        # "Host version X does not match binary version Y"。
        # 版本来源：frontend/package-lock.json 里 node_modules/esbuild 与
        # node_modules/rollup 的 version，升级这两个包时要同步改这里。
        # backend/tests/test_deploy_config.py 会校验此处与 lock 一致。
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund \
            @rollup/rollup-linux-x64-gnu@4.64.6 \
            @esbuild/linux-x64@0.21.5
        working-directory: frontend

      - name: Generate API types from backend OpenAPI
        # 用 quality job 已装好的解释器，避免再起一份 venv
        run: npm run gen:api
        working-directory: frontend
        env:
          HS_PYTHON: python

      - name: Typecheck frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        # 前端产物在这里产出，而不是在 Dockerfile 里。
        # 原因见 deploy/Dockerfile.single 头部：package-lock 是在 Windows 上生成的，
        # npm 只记录当前平台的可选依赖，镜像 stage 里装不全原生模块。
        run: npx vite build > /tmp/vite.log 2>&1 || (cat /tmp/vite.log; exit 1)
        working-directory: frontend

      - name: Upload build log on failure
        # 失败时把完整日志上传成 artifact —— Actions 的普通日志在无 admin token 时
        # 读不到，artifact 可以直接下载。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-log
          path: /tmp/vite.log
          retention-days: 7

      - name: Preserve build log
        # 成功时也留着，便于对照（体积很小）；失败时由上一步上传
        if: always()
        run: cp /tmp/vite.log "$RUNNER_TEMP/vite.log" 2>/dev/null || true

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: frontend/dist
          retention-days: 1

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # git tag v1.0.8 → "v1.0.8"
            type=semver,pattern={{raw}}
            # 每次构建 → "sha-<短哈希>"
            type=sha,prefix=sha-,format=short
            # 每次构建 → "latest"（仅 main 和 tag 触发，PR 不触发）
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.single
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
