# ============================================================
# 健康运动管理系统 · CI 构建并推送 ghcr.io
#
# 触发：
#   - push main  → 推 :latest + :sha-<短哈希>
#   - git tag v* → 推 :v<版本号> + :latest
#
# 镜像 secret-free：secrets/ 不在仓库中（gitignore + dockerignore），
# 运行时通过 compose 卷挂载注入。
# ============================================================
name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 质量门禁：镜像构建的前置条件（ARCHITECTURE_REVIEW A.9.1）。
  # ruff + pytest + 前端类型检查任一失败 → build-and-push 不启动。
  #
  # 前端类型检查必须**先 gen:api 再 tsc**（A.9）：
  # `schema.d.ts` 不入库，类型是从后端 OpenAPI 现生成的。顺序错了会直接
  # 「找不到模块」——这是刻意的，让「忘了生成」在构建期暴露。
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        # 必装全量依赖（含 fitdecode / garmin-fit-sdk），否则 FIT 相关用例会被跳过
        run: pip install -e "./backend[dev]"

      - name: Ruff
        run: ruff check app/ scripts/ tests/
        working-directory: backend

      - name: Pytest
        run: python -m pytest tests/ -q
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Generate API types from backend OpenAPI
        # 用 quality job 已装好的解释器，避免再起一份 venv
        run: npm run gen:api
        working-directory: frontend
        env:
          HS_PYTHON: python

      - name: Typecheck frontend
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Upload generated schema
        # 镜像构建阶段没有 Python，拿不到 OpenAPI；把生成结果传下去复用，
        # 保证「通过类型检查的那份类型」与「打进镜像的那份类型」完全一致。
        uses: actions/upload-artifact@v4
        with:
          name: api-schema
          path: frontend/src/api/schema.d.ts
          retention-days: 1

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated schema
        uses: actions/download-artifact@v4
        with:
          name: api-schema
          path: frontend/src/api

      - name: Smoke-test frontend build in alpine
        # 在真正构建镜像之前，用与镜像 stage 1 完全一致的基础镜像跑一遍构建。
        # Dockerfile 里的 RUN 失败时，Actions 只能在注解里给出「did not complete
        # successfully: exit code: 1」，拿不到 tsc / vite 的真实报错；
        # 这一步把同样的命令搬到普通 step 里跑，日志完整可见。
        # 环境一致（node:22-alpine + 同样的 npm install）→ 结论可迁移。
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/frontend:/fe" \
            -w /fe \
            node:22-alpine \
            sh -c "npm install --no-audit --no-fund && npx tsc --noEmit && npx vite build" \
            2>&1 | tee /tmp/fe-build.log
          status=$?
          if [ $status -ne 0 ]; then
            # 把关键错误行提到注解里 —— Docker step 的日志在无 token 时读不到，
            # 但注解能直接从 API 拿到
            grep -iE "error|Error|cannot|failed|TS[0-9]{4}" /tmp/fe-build.log | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # git tag v1.0.8 → "v1.0.8"
            type=semver,pattern={{raw}}
            # 每次构建 → "sha-<短哈希>"
            type=sha,prefix=sha-,format=short
            # 每次构建 → "latest"（仅 main 和 tag 触发，PR 不触发）
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.single
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
