# ============================================================
# 健康运动管理系统 · 单容器部署（NAS / 本机通用）
#
# 与 docker-compose.nas.yml 的区别：三个服务合并为 1 个容器（hs-app），
# 仅暴露 1 个宿主端口，资源护栏按「三进程合体」重新设定。
#
# 用法：
#   docker compose -f docker-compose.single.yml up -d
#   docker compose -f docker-compose.single.yml ps
#   docker compose -f docker-compose.single.yml logs -f
#
# 访问：http://<NAS_IP>:18080/
# ============================================================

services:
  app:
    image: hs-app:${HS_TAG:-v1.0.4}
    container_name: hs-app
    env_file: .env
    environment:
      # 覆盖 .env 中的本地路径，统一指向容器内挂载点
      RAW_DATA_DIR: /data/raw
      DB_PATH: /data/db/health.db
      AUDIT_DIR: /data/audit
      GARMIN_TOKENSTORE: /data/garmin_tokens
      QWEATHER_PRIVATE_KEY_PATH: /app/secrets/qweather_ed25519_private.pem
      APP_HOST: 127.0.0.1
      APP_PORT: "8000"
    # —— DNS ——
    # 群晖上 Docker 内置 DNS(127.0.0.11) 转发失败，导致容器内所有域名解析报
    # "Temporary failure in name resolution"（Garmin/和风/LLM 全部外呼失败）。
    # 显式指定上游 DNS，绕过 embedded DNS。
    # 192.168.2.1 为局域网路由器 DNS；223.5.5.5 为公网兜底。
    dns:
      - 192.168.2.1
      - 223.5.5.5
    volumes:
      # raw 必须可写（首次同步落盘）；「不覆盖」由应用层保证（REQ-DATA-001）
      - ./data/raw:/data/raw
      - ./data/db:/data/db
      - ./data/audit:/data/audit
      - ./data/garmin_tokens:/data/garmin_tokens
    ports:
      # 注意：变量名必须与 .env 中的 APP_PORT 区分。
      # .env 的 APP_PORT=8000 是容器内 uvicorn 端口，若此处复用同名变量，
      # compose 插值会取到 8000，导致宿主端口错配。
      - "${HS_APP_PORT:-18080}:80"
    # —— 资源护栏 ——
    # 群晖 DSM（内核 4.4.302+ geminilake_220+）的 cgroup 能力缺口：
    #   1) 无 cpu.cfs_quota_us  -> cpus / cpu_quota 不可用（内核未编译 CFS_BANDWIDTH）
    #   2) 无 pids 子系统        -> pids_limit 不可用
    #   3) memory 子系统完整     -> mem_limit / memswap_limit 可用（关键护栏，保留）
    # 故此处仅保留内存上限；CPU 侧依靠「uvicorn 单 worker + 定时任务串行」自然约束。
    mem_limit: 1024m
    memswap_limit: 1024m     # 与 mem_limit 相等 => 禁用 swap，避免换页拖垮宿主
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/ops/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
