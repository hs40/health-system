[project]
name = "health-system-backend"
version = "0.1.0"
description = "健康运动管理系统 · 后端（FastAPI + python-garminconnect）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "garminconnect>=0.3.17",
    # FIT 解析（P4）：官方 SDK 主解析 + fitdecode 交叉校验（Q33=A）
    # 官方 SDK 版本与 Garmin FIT SDK 同步发布，Profile 为权威来源
    "garmin-fit-sdk>=21.218",
    "fitdecode>=0.11",
    "openai>=1.50",
    # 和风天气 JWT(EdDSA/Ed25519) 签名（E20）；不用 PyJWT（会注入 typ 头）
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：FastAPI 依赖注入惯用法（Depends/Query 作为默认值）属正常写法，予以忽略。
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic 自动生成的迁移脚本不做手工格式化（行宽等由 autogenerate 决定）。
"app/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
