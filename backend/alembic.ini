# Alembic config (T1.1, introduced in phase 2).
# Usage (from backend/):
#   .venv/Scripts/python -m alembic -c alembic.ini upgrade head
# DB URL is read from app.config.Settings in app/db/migrations/env.py (not hardcoded here).
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
# Placeholder only; env.py overrides this at runtime.
sqlalchemy.url = sqlite:///./data/db/health.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
