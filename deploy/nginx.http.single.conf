# http 上下文片段：由 /etc/nginx/conf.d/hs.conf 首行 include 引入。
#
# 为什么单独一个文件：``map`` 与 ``log_format`` 都只允许出现在 ``http`` 上下文，
# 而 ``conf.d/*.conf`` 是**被 http 块 include 的整个文件**——写在该文件里本身没问题，
# 但 ``server`` 块一开就进了 server 上下文。v3.4.0 把 ``log_format`` 误写在
# ``server {}`` 内部，nginx 直接 fatal（"log_format" directive is not allowed here），
# 容器起不来。拆成独立片段并由 ``http`` 层 include，语义才正确。
#
# $request_id：nginx 内置变量，每个请求一个 32 位十六进制 ID。
# 前端若已带 X-Request-ID（client.ts 会带）则原样透传，保证浏览器 → Nginx
# → 后端是同一条链；没带才用内置的生成，让「进后端之前」的请求
# （404、超时、静态资源）也有 ID。
map $http_x_request_id $hs_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# access log 带 rid= 字段，与后端日志的 [req ...] 可对齐。
log_format hs '$remote_addr - [$time_local] "$request" $status '
              '$body_bytes_sent rid=$hs_request_id rt=$request_time';
