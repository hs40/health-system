# 单容器内 nginx：托管前端静态资源 + 反代 /api/ 到同容器内的 uvicorn
#
# 本文件被 /etc/nginx/nginx.conf 的 http 块 include，因此**本文件顶层就是 http 上下文**。
# ``map`` / ``log_format`` 只能出现在 http 上下文——它们放在被 include 的
# nginx.http.single.conf 里（见该文件头部的踩坑说明）。
# 本文件一旦进入 ``server {}`` 就是 server 上下文，那里只能写 server/location 级指令。
include /etc/nginx/hs-http.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout hs;
    error_log  /dev/stderr warn;

    # 后端 API 反向代理（同源，避免 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $hs_request_id;
        # 同步任务可能较久（Garmin 串行抓取 + LLM），放宽超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源也带同一 header：前端加载失败时能对上 Nginx 日志。
        add_header X-Request-ID $hs_request_id always;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
