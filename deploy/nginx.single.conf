# 单容器内 nginx：托管前端静态资源 + 反代 /api/ 到同容器内的 uvicorn
#
# $request_id：nginx 内置变量，为每个请求生成 32 位十六进制 ID。
# 它比「让后端自己生成」多一层价值——**进后端之前**的请求（404、超时、
# 静态资源、Nginx 自己的错误页）也有一条可追踪的 ID。
# 前端若已带 X-Request-ID（client.ts 会带），则原样透传，保证浏览器 → Nginx
# → 后端是同一条链。两层都不打日志时至少有这里兜底。
map $http_x_request_id $hs_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # access log 带上 request_id（第二个字段），与后端日志可对齐。
    log_format hs '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  'rid=$hs_request_id rt=$request_time "$http_referer"';
    access_log /dev/stdout hs;
    error_log  /dev/stderr warn;

    # 后端 API 反向代理（同源，避免 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $hs_request_id;
        # 同步任务可能较久（Garmin 串行抓取 + LLM），放宽超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源也带同一 header：前端加载失败时能对上 Nginx 日志。
        add_header X-Request-ID $hs_request_id always;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
